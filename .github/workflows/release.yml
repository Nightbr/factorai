name: Release

# Tag-driven, and the tag is the only source of truth for the version: the
# three version fields in the repo stay at whatever they say and are rewritten
# from the tag at build time (see "Set version from tag" below). No bump commit
# to forget, no chance of a tag disagreeing with a file.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release is created as a DRAFT so a half-finished matrix can never publish a
# release missing one platform's assets, and **the `publish` job at the end flips
# it live once the matrix is green** (2026-08-18, while factorai is alpha). What
# changed is who holds the gate, not whether there is one: `needs: build` means a
# failed platform skips publication entirely, and the job re-counts the assets
# and re-reads `latest.json` before it publishes. See ADR-0014, which amends
# ADR-0010's consequence 2 — that ADR leans on "drafts until published by hand"
# as the thing gating a rollout, and this replaces the hand with the check.
#
# **The check is not decoration.** The failure this guards against is silent: on
# v0.10.1 both matrix jobs reported success and produced a release whose
# `latest.json` listed one platform, telling every other platform there was
# nothing to update to. A human counting assets caught it. Nothing else would
# have.
#
# **The draft is created once, by its own job, and the matrix uploads into it by
# id** (fixed 2026-08-17). It used to be created by whichever matrix job got
# there first, with the other finding it and joining — which is a race, and on
# v0.10.1 both jobs lost it: two draft releases for one tag, Linux's assets in
# one and macOS's in the other. Each also carried its own `latest.json`, so
# neither manifest listed both platforms and the app would have seen a
# single-platform release. The failure is silent — both jobs report success, and
# `gh release view <tag>` shows whichever draft it happens to pick, complete on
# its own terms.
#
# Note this workflow does NOT run the test gate. Tagging an unverified commit
# ships an unverified build; .claude/skills/quality-gate/ is the gate, and it runs locally.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release build half-way — a partially uploaded draft is worse
  # than a slow one.
  cancel-in-progress: false

jobs:
  # Exactly one draft, before any platform builds. Every asset and both halves
  # of `latest.json` then land in the same release, because there is only one to
  # land in.
  create-release:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: draft
        with:
          # `result-encoding: string` because the id is consumed as a workflow
          # output, and the default JSON encoding would quote it.
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Reuse rather than create if a draft for this tag already exists:
            // re-running this job must not produce the second draft the whole
            // job exists to prevent. Note draft releases are NOT returned by
            // the releases/tags/{tag} endpoint, so this has to list and match.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`reusing existing release ${existing.id} for ${tag}`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `factorai ${tag}`,
              draft: true,
              // NOT a prerelease, despite 0.x — see the note on the build job.
              prerelease: false,
              generate_release_notes: true,
            });
            core.info(`created release ${data.id} for ${tag}`);
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      # One platform failing must not cancel the other: its assets still join
      # the draft, and the failed job can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            # One dmg that runs natively on both Apple Silicon and Intel,
            # rather than two assets and a "which one?" question.
            # app + dmg: the dmg is what people download, the .app.tar.gz is
            # what the updater consumes (F14). Both are wanted now — this
            # deliberately reverses the earlier --bundles dmg, which was correct
            # only while there was no updater to feed.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            # NOT ubuntu-22.04: it starts deprecation on 2026-09-17 with
            # brownouts that deliberately fail jobs. The cost of 24.04 is the
            # glibc floor — these bundles need glibc 2.39+, so Ubuntu 24.04+ /
            # Debian 13+ / Fedora 40+, and NOT Ubuntu 22.04. Documented in the
            # README. To widen it again, build inside an ubuntu:22.04 container
            # on a supported runner rather than pinning a dying image.
            platform: ubuntu-24.04
            # AppImage only: Tauri's updater can replace an AppImage in place
            # but never a .deb, since apt owns those files. Shipping a .deb that
            # silently never self-updates is worse than not shipping one.
            args: --bundles appimage
            rust-targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace is the repo root; src-tauri is a member.
          key: ${{ matrix.platform }}

      # Before the version rewrite: --frozen-lockfile should see the tree
      # exactly as it was committed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building $VERSION from $GITHUB_REF_NAME"
          # Node rather than sed: BSD and GNU sed disagree about -i, and this
          # runs on both macOS and Linux. Nothing is committed back.
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(f, "utf8"));
              json.version = v;
              fs.writeFileSync(f, `${JSON.stringify(json, null, "\t")}\n`);
            }
            const cargo = "apps/desktop/src-tauri/Cargo.toml";
            const before = fs.readFileSync(cargo, "utf8");
            // Test the pattern rather than comparing before/after: when the tag
            // matches the version already committed, the rewrite is a legitimate
            // no-op, and an equality check would call that a missing version line.
            const line = /^version = ".*"$/m;
            if (!line.test(before)) throw new Error("Cargo.toml has no [package] version line");
            fs.writeFileSync(cargo, before.replace(line, `version = "${v}"`));
          ' "$VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds
          # but ships unsigned bundles the app will refuse to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is generated without a passphrase; the CLI still wants the
          # variable present or it prompts and hangs the job.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Upload into the one draft `create-release` made, rather than each job
          # creating-or-finding its own. `tagName` / `releaseName` /
          # `releaseDraft` / `prerelease` / `generateReleaseNotes` are creation
          # inputs and deliberately absent: with `releaseId` set they have
          # nothing to do, and leaving them would suggest this step still
          # decides those things. `create-release` owns them now, including the
          # "not a prerelease despite 0.x" rule — GitHub's /releases/latest,
          # which the updater resolves through, skips prereleases entirely, so
          # marking them would leave every installed app polling a 404 forever.
          # The `publish` job is what un-drafts this, after checking the matrix
          # actually produced both platforms' assets.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is the manifest the app polls (F14, ADR-0010). Both jobs
          # write it and the second **merges into** the first's — which is only
          # true because they now share one release; when v0.10.1 raced into two,
          # each manifest listed only its own platform. The
          # .sig files that prove an update came from us need no input — they
          # are bundle artifacts and upload with the rest.
          #
          # The name matters and has churned: this is `includeUpdaterJson` on
          # `@v0`, renamed to `uploadUpdaterJson` on the action's `dev` branch,
          # and a wrong one is only a **warning** — v0.7.0 shipped with two
          # inputs the action had never heard of, and worked purely because
          # this defaults to true. If you retarget the action, re-read its
          # `action.yml` at the ref you pin rather than its README:
          #   gh api repos/tauri-apps/tauri-action/contents/action.yml?ref=<sha>
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Flip the draft live. Separate job rather than a step on `build`, because
  # `build` is a matrix: a step there would run twice and each copy would only
  # know about its own platform, which is precisely the blind spot that shipped a
  # one-platform manifest on v0.10.1.
  #
  # `needs: build` is the first half of the gate and the cheap half — a matrix job
  # that fails or is cancelled skips this job entirely, so a half-finished release
  # stays a draft exactly as it did when a human published it.
  publish:
    name: Publish the release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const { owner, repo } = context.repo;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            const names = assets.map((a) => a.name);
            core.info(`assets: ${names.join(', ') || '(none)'}`);

            // The second half of the gate, and the half that catches what green
            // matrix jobs do not say. Each platform's installer plus the manifest
            // the app polls — checked by suffix rather than exact name, because
            // the version is in most of them and the tag is not this job's
            // business.
            const required = [
              ['a macOS installer', (n) => n.endsWith('.dmg')],
              ['a macOS updater bundle', (n) => n.endsWith('.app.tar.gz')],
              ['a Linux installer', (n) => n.endsWith('.AppImage')],
              ['the updater manifest', (n) => n === 'latest.json'],
            ];
            const missing = required.filter(([, match]) => !names.some(match)).map(([what]) => what);
            if (missing.length) {
              core.setFailed(
                `Refusing to publish ${release_id}: missing ${missing.join(', ')}. ` +
                  `The release stays a draft — re-run the failed matrix job, then re-run this one.`,
              );
              return;
            }

            // And the manifest's own contents, which is where v0.10.1 actually
            // went wrong: both platforms' jobs succeeded, and the file still
            // named one of them. `latest.json` is fetched through the API rather
            // than its browser URL because a draft's assets are not public yet.
            const manifest = assets.find((a) => a.name === 'latest.json');
            const res = await github.request({
              method: 'GET',
              url: manifest.url,
              headers: { accept: 'application/octet-stream' },
            });
            let platforms;
            try {
              platforms = Object.keys(JSON.parse(Buffer.from(res.data).toString('utf8')).platforms);
            } catch (e) {
              core.setFailed(`Refusing to publish ${release_id}: latest.json is unreadable (${e}).`);
              return;
            }
            core.info(`latest.json platforms: ${platforms.join(', ') || '(none)'}`);

            const unlisted = ['darwin', 'linux'].filter(
              (os) => !platforms.some((key) => key.startsWith(os)),
            );
            if (unlisted.length) {
              core.setFailed(
                `Refusing to publish ${release_id}: latest.json lists no ${unlisted.join(' or ')} ` +
                  `platform, so those installs would see no update. The release stays a draft.`,
              );
              return;
            }

            // Still not a prerelease, and this is load-bearing rather than
            // inherited: GitHub's /releases/latest skips prereleases, and that
            // endpoint is what the updater resolves through (ADR-0010). Marking
            // an alpha as a prerelease would leave every installed copy polling a
            // 404 — which is why "alpha" here changes who publishes, not how the
            // release is labelled.
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
            core.info(`published release ${release_id}`);
