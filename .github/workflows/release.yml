name: Release

# Tag-driven, and the tag is the only source of truth for the version: the
# three version fields in the repo stay at whatever they say and are rewritten
# from the tag at build time (see "Set version from tag" below). No bump commit
# to forget, no chance of a tag disagreeing with a file.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release is created as a DRAFT so a half-finished matrix can never publish
# a release missing one platform's assets — review, then publish by hand.
#
# Note this workflow does NOT run the test gate. Tagging an unverified commit
# ships an unverified build; CLAUDE.md § 2c is the gate, and it runs locally.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release build half-way — a partially uploaded draft is worse
  # than a slow one.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing must not cancel the other: its assets still join
      # the draft, and the failed job can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            # One dmg that runs natively on both Apple Silicon and Intel,
            # rather than two assets and a "which one?" question.
            # app + dmg: the dmg is what people download, the .app.tar.gz is
            # what the updater consumes (F14). Both are wanted now — this
            # deliberately reverses the earlier --bundles dmg, which was correct
            # only while there was no updater to feed.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            # NOT ubuntu-22.04: it starts deprecation on 2026-09-17 with
            # brownouts that deliberately fail jobs. The cost of 24.04 is the
            # glibc floor — these bundles need glibc 2.39+, so Ubuntu 24.04+ /
            # Debian 13+ / Fedora 40+, and NOT Ubuntu 22.04. Documented in the
            # README. To widen it again, build inside an ubuntu:22.04 container
            # on a supported runner rather than pinning a dying image.
            platform: ubuntu-24.04
            # AppImage only: Tauri's updater can replace an AppImage in place
            # but never a .deb, since apt owns those files. Shipping a .deb that
            # silently never self-updates is worse than not shipping one.
            args: --bundles appimage
            rust-targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace is the repo root; src-tauri is a member.
          key: ${{ matrix.platform }}

      # Before the version rewrite: --frozen-lockfile should see the tree
      # exactly as it was committed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building $VERSION from $GITHUB_REF_NAME"
          # Node rather than sed: BSD and GNU sed disagree about -i, and this
          # runs on both macOS and Linux. Nothing is committed back.
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(f, "utf8"));
              json.version = v;
              fs.writeFileSync(f, `${JSON.stringify(json, null, "\t")}\n`);
            }
            const cargo = "apps/desktop/src-tauri/Cargo.toml";
            const before = fs.readFileSync(cargo, "utf8");
            // Test the pattern rather than comparing before/after: when the tag
            // matches the version already committed, the rewrite is a legitimate
            // no-op, and an equality check would call that a missing version line.
            const line = /^version = ".*"$/m;
            if (!line.test(before)) throw new Error("Cargo.toml has no [package] version line");
            fs.writeFileSync(cargo, before.replace(line, `version = "${v}"`));
          ' "$VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still succeeds
          # but ships unsigned bundles the app will refuse to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is generated without a passphrase; the CLI still wants the
          # variable present or it prompts and hangs the job.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: factorai ${{ github.ref_name }}
          releaseDraft: true
          # NOT a prerelease, despite 0.x: GitHub's /releases/latest — which the
          # updater endpoint resolves through — skips prereleases entirely, so
          # marking them would leave every installed app polling a 404 forever.
          # Draft still gates it: nothing is visible to the updater until you
          # publish the draft by hand.
          prerelease: false
          generateReleaseNotes: true
          # latest.json is the manifest the app polls (F14, ADR-0010). The
          # .sig files that prove an update came from us need no input — they
          # are bundle artifacts and upload with the rest.
          #
          # The name matters and has churned: this is `includeUpdaterJson` on
          # `@v0`, renamed to `uploadUpdaterJson` on the action's `dev` branch,
          # and a wrong one is only a **warning** — v0.7.0 shipped with two
          # inputs the action had never heard of, and worked purely because
          # this defaults to true. If you retarget the action, re-read its
          # `action.yml` at the ref you pin rather than its README:
          #   gh api repos/tauri-apps/tauri-action/contents/action.yml?ref=<sha>
          includeUpdaterJson: true
          args: ${{ matrix.args }}
