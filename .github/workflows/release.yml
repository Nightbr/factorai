name: Release

# The build-and-publish half of a release, called by `alpha.yml` (an alpha,
# after Quality passes on main) and by `promote.yml` (a stable, promoted from
# an alpha). **Nobody runs this by hand and no tag push reaches it** — a
# hand-pushed `v*` tag is refused by `release-guard.yml` instead (ADR-0064,
# which supersedes ADR-0014's trigger and keeps its gate).
#
# The caller computes the version and hands it in; this workflow tags the
# commit, rewrites the version fields to match (`scripts/release/cli.mjs
# set-version`), builds, and publishes. The repo's own fields hold the *next
# stable* (`0.49.0`), so an alpha build is the one place `0.49.0-alpha.3`
# exists. Nothing is committed back from here.
#
# The release is created as a DRAFT so a half-finished matrix can never publish
# a release missing one platform's assets, and the `publish` job at the end
# flips it live once the matrix is green and a check has re-counted the assets
# and re-read `latest.json` (ADR-0014, 2026-08-18).
#
# **The check is not decoration.** The failure this guards against is silent: on
# v0.10.1 both matrix jobs reported success and produced a release whose
# `latest.json` listed one platform, telling every other platform there was
# nothing to update to. A human counting assets caught it. Nothing else would
# have.
#
# **The draft is created once, by its own job, and the matrix uploads into it by
# id** (fixed 2026-08-17). It used to be created by whichever matrix job got
# there first, with the other finding it and joining — which is a race, and on
# v0.10.1 both jobs lost it: two draft releases for one tag, Linux's assets in
# one and macOS's in the other.
#
# **The two channels differ in four places, and only four** (ADR-0064): an alpha
# is marked prerelease, builds no Windows bootstrapper, is never Latest, and
# after publishing copies its `latest.json` into the `alpha-channel` pointer
# release — which is what alpha installs poll, because GitHub's
# `/releases/latest` skips prereleases and stable installs poll that.

on:
  workflow_call:
    inputs:
      version:
        description: 'The exact version to build, without the v: 0.49.0-alpha.3 or 0.49.0'
        required: true
        type: string
      sha:
        description: 'The commit to tag and build'
        required: true
        type: string
      channel:
        description: 'alpha or stable'
        required: true
        type: string
      notes:
        description: 'The release body, from scripts/release/cli.mjs notes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Exactly one draft, before any platform builds. Every asset and both halves
  # of `latest.json` then land in the same release, because there is only one to
  # land in.
  create-release:
    name: Tag and create the draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: draft
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
        with:
          # `result-encoding: string` because the id is consumed as a workflow
          # output, and the default JSON encoding would quote it.
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const { VERSION, SHA, CHANNEL, NOTES } = process.env;
            const tag = `v${VERSION}`;

            // The tag first, on the exact commit the caller verified. Created
            // with GITHUB_TOKEN, so it triggers no workflow — which is what
            // lets release-guard.yml treat every tag push it sees as a person.
            // A re-run finds its own tag; a tag on any *other* commit is a
            // collision this job must not paper over.
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.object.sha !== SHA) {
                core.setFailed(`${tag} already points at ${ref.object.sha}, not ${SHA}.`);
                return '';
              }
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: SHA });
              core.info(`tagged ${tag} at ${SHA}`);
            }

            // Reuse rather than create if a draft for this tag already exists:
            // re-running this job must not produce the second draft the whole
            // job exists to prevent. Draft releases are NOT returned by the
            // releases/tags/{tag} endpoint, so this has to list and match.
            const { data: releases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`reusing existing release ${existing.id} for ${tag}`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `factorai ${tag}`,
              body: NOTES,
              draft: true,
              // Honest now (ADR-0064): an alpha is a prerelease, and stays off
              // /releases/latest because of it. A stable is not one, which is
              // what keeps it the release /releases/latest resolves to.
              prerelease: CHANNEL === 'alpha',
            });
            core.info(`created release ${data.id} for ${tag}`);
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      # One platform failing must not cancel the other: its assets still join
      # the draft, and the failed job can be re-run on its own.
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            # One dmg that runs natively on both Apple Silicon and Intel,
            # rather than two assets and a "which one?" question.
            # app + dmg: the dmg is what people download, the .app.tar.gz is
            # what the updater consumes (F14). Both are wanted now — this
            # deliberately reverses the earlier --bundles dmg, which was correct
            # only while there was no updater to feed.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            # NOT ubuntu-22.04: it starts deprecation on 2026-09-17 with
            # brownouts that deliberately fail jobs. The cost of 24.04 is the
            # glibc floor — these bundles need glibc 2.39+, so Ubuntu 24.04+ /
            # Debian 13+ / Fedora 40+, and NOT Ubuntu 22.04. Documented in the
            # README. To widen it again, build inside an ubuntu:22.04 container
            # on a supported runner rather than pinning a dying image.
            platform: ubuntu-24.04
            # AppImage only: Tauri's updater can replace an AppImage in place
            # but never a .deb, since apt owns those files. Shipping a .deb that
            # silently never self-updates is worse than not shipping one.
            args: --bundles appimage
            rust-targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-tools

      # The AppImage bundles its own WebKit and therefore its own
      # `libgstreamer-1.0.so.0`, which relocates its plugin search to the
      # directory it was loaded from — so the system plugins the host has
      # installed become unreachable from inside the bundle (ADR-0058).
      # `bundleMediaFramework` copies the runner's plugins in to replace them,
      # unfiltered and without checking that there are any: with the packages
      # above missing it copies an empty directory and ships a bundle exactly
      # as broken as one built without the flag. So the runner is the bill of
      # materials, and this is the assertion that it is stocked.
      - name: Assert the media plugins the AppImage will bundle are present
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          missing=()
          for element in appsink autoaudiosink qtdemux matroskademux mpegtsdemux \
                         avdec_h264 vp9dec mpegaudioparse; do
            gst-inspect-1.0 "$element" >/dev/null 2>&1 || missing+=("$element")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::GStreamer elements missing on the runner, so the AppImage would ship without them: ${missing[*]}"
            exit 1
          fi
          test -x /usr/lib/"$(uname -m)"-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace is the repo root; src-tauri is a member.
          key: ${{ matrix.platform }}

      # Before the version rewrite: --frozen-lockfile should see the tree
      # exactly as it was committed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing is committed back: the repo keeps the next stable, and only this
      # build is stamped with the exact version (ADR-0064).
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.mjs set-version "$VERSION"

      # What the About pane reads (F29). After the rewrite above, so the version
      # it records is the build's, and before the frontend build, because Vite
      # copies `public/` into `dist/` as it runs. Gitignored and never committed:
      # a build without this file is a build that did not come from here, and the
      # app says so rather than inventing a date (ADR-0049).
      #
      # `continue-on-error` deliberately: the pane degrades to its dev wording
      # without this file, and a release is not worth failing over a credit list.
      - name: Write build metadata
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not GITHUB_SHA: under workflow_run and workflow_dispatch that is
          # main's head, not the commit being built.
          FACTORAI_COMMIT: ${{ inputs.sha }}
        run: node scripts/write-build-info.mjs

      # Apple code signing, macOS only. The certificate is **self-signed**, not
      # a Developer ID one (ADR-0034), so Gatekeeper is unaffected and the
      # README's right-click-Open section stands. What it buys is a *stable*
      # designated requirement: TCC anchors every grant to it, and an ad-hoc
      # signature has no identity, so the requirement falls back to the cdhash
      # and every release orphans every permission the user has granted.
      #
      # The keychain is built here rather than by handing the bundler
      # APPLE_CERTIFICATE, which looks like the shorter path and cannot work:
      # that branch resolves the identity through `identity::list()`, which
      # searches only for certificates whose common name starts with one of
      # seven Apple prefixes ("Developer ID Application:", "Apple
      # Development:", ...) and also demands an organizational unit to read as
      # a team id. A self-signed certificate matches none of them, the list
      # comes back empty, and the build fails on `ResolveSigningIdentity`. The
      # alternative — naming the certificate as if Apple had issued it — would
      # put a false authority in every signature, so: import by hand, and pass
      # APPLE_SIGNING_IDENTITY, which takes the `with_signing_identity` path
      # and asks the certificate no questions.
      #
      # Both variables are step-scoped and deliberately NOT exported: the
      # bundler reads APPLE_CERTIFICATE with `var_os`, so the empty string a
      # missing secret expands to would count as present and fail the build.
      # A fork without the secrets must build ad-hoc, as this workflow did
      # before.
      #
      # Notarization needs APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID or an App
      # Store Connect key, all deliberately absent — it takes a paid Developer
      # Program certificate, and it is not what grants App Management anyway.
      # Its absence is a `log::warn!` in the bundler, not an error.
      - name: Import the macOS signing certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE is not set; this build will be ad-hoc signed."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/factorai-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/factorai-signing.p12"
          PEM="$RUNNER_TEMP/factorai-signing.pem"

          printf %s "$APPLE_CERTIFICATE" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut: no auto-lock in the middle of a universal build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -A

          # Without this, codesign's first use of the private key raises a GUI
          # authorisation prompt no runner can answer, and the job hangs until
          # it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # codesign resolves an identity through the user's keychain search
          # list, and `with_signing_identity` passes no --keychain. So the
          # temporary keychain has to JOIN that list, not replace it: -s
          # rewrites it wholesale, and dropping login.keychain there breaks
          # every other step that reads a credential.
          # shellcheck disable=SC2046
          security list-keychains -d user -s \
            $(security list-keychains -d user | tr -d '" ') "$KEYCHAIN"

          # A self-signed certificate is not *valid for code signing* until it
          # is trusted for it, and codesign refuses an identity it cannot
          # validate — `find-identity -v -p codesigning` would not even list
          # it. Trust is set on the build machine only. No user's machine
          # trusts this certificate and none is meant to: Gatekeeper still
          # treats these bundles as unsigned, and the grant persistence this
          # whole step exists for keys off the certificate's hash, not off
          # anyone trusting it (ADR-0034).
          security find-certificate -p "$KEYCHAIN" > "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$PEM"

          rm -f "$P12" "$PEM"

          # One identity in a keychain that holds exactly one, read back rather
          # than hardcoded — the certificate's common name is a property of the
          # secret, not of this file.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)"$/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::the certificate imported but is not valid for code signing"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_SIGNING_IDENTITY is NOT here — the step above puts it in
          # GITHUB_ENV, and only once a certificate has actually imported and
          # proved valid for code signing. See its comment.
          #
          # Signs the updater artifacts. Without these the build still succeeds
          # but ships unsigned bundles the app will refuse to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is generated without a passphrase; the CLI still wants the
          # variable present or it prompts and hangs the job.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # What tells `vite.config.ts` this is a release, so the bundle's
          # version define is the one set above rather than `<next>-dev`.
          FACTORAI_RELEASE: '1'
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Upload into the one draft `create-release` made, rather than each job
          # creating-or-finding its own. `tagName` / `releaseName` /
          # `releaseDraft` / `prerelease` / `generateReleaseNotes` are creation
          # inputs and deliberately absent: with `releaseId` set they have
          # nothing to do, and leaving them would suggest this step still
          # decides those things. `create-release` owns them now, including
          # which channel's releases are prereleases (ADR-0064). The `publish` job is what un-drafts this, after checking the matrix
          # actually produced both platforms' assets.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is the manifest the app polls (F14, ADR-0010). Both jobs
          # write it and the second **merges into** the first's — which is only
          # true because they now share one release; when v0.10.1 raced into two,
          # each manifest listed only its own platform. The
          # .sig files that prove an update came from us need no input — they
          # are bundle artifacts and upload with the rest.
          #
          # The name matters and has churned: this is `includeUpdaterJson` on
          # `@v0`, renamed to `uploadUpdaterJson` on the action's `dev` branch,
          # and a wrong one is only a **warning** — v0.7.0 shipped with two
          # inputs the action had never heard of, and worked purely because
          # this defaults to true. If you retarget the action, re-read its
          # `action.yml` at the ref you pin rather than its README:
          #   gh api repos/tauri-apps/tauri-action/contents/action.yml?ref=<sha>
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The Windows deliverable (ADR-0044). Not a third platform in `build`: there is
  # no `windows-msvc` compile, because factorai on Windows *is* the Linux
  # AppImage the matrix above already produced, running inside a WSL 2
  # distribution under WSLg. What this job makes is the ~1 MB bootstrapper that
  # puts it there.
  #
  # **It runs on Linux.** `makensis` is in apt, so no Windows runner joins this
  # workflow — which is also why this job blocking `publish` costs nothing in
  # flakiness: it compiles no Rust and touches no Windows.
  #
  # `needs: build` and not just `create-release`, because the installer's whole
  # job is to download an AppImage from this release. Starting before that asset
  # exists would produce an installer that is correct and useless.
  installer:
    name: Windows (WSL 2) installer
    needs: [create-release, build]
    # Stable only (ADR-0064): a Windows user who wants alpha installs stable and
    # switches channel, since the installed app is the Linux AppImage and polls
    # the Linux manifest like any other.
    if: inputs.channel == 'stable'
    runs-on: ubuntu-24.04
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Read the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"

      # The name the Linux job's bundler produced. Asserted rather than assumed:
      # a bundler rename would otherwise ship an installer whose download 404s
      # on first run, which is the kind of silent break this workflow's header
      # is entirely about.
      - name: Locate the AppImage in the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(gh release view "$TAG" --json assets \
            --jq '.assets[].name | select(endswith(".AppImage"))' | head -1)"
          if [ -z "$NAME" ]; then
            echo "::error::no .AppImage asset on $TAG — the Linux build must land first"
            exit 1
          fi
          echo "Found $NAME"
          echo "APPIMAGE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}" >> "$GITHUB_ENV"

      - name: Build the installer
        working-directory: apps/desktop/installer
        run: makensis -DVERSION="$VERSION" -DAPPIMAGE_URL="$APPIMAGE_URL" factorai.nsi

      # Unsigned, on purpose and not by omission: there is no free Authenticode
      # CA, and self-signing buys nothing a Windows user sees. ADR-0044
      # consequence 4 has the reasoning and the SignPath Foundation plan, which
      # lands as one more step here and no other change.
      - name: Upload into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "apps/desktop/installer/factorai-setup-${VERSION}.exe" --clobber

  # Flip the draft live. Separate job rather than a step on `build`, because
  # `build` is a matrix: a step there would run twice and each copy would only
  # know about its own platform, which is precisely the blind spot that shipped a
  # one-platform manifest on v0.10.1.
  #
  # `needs: build` is the first half of the gate and the cheap half — a matrix job
  # that fails or is cancelled skips this job entirely, so a half-finished release
  # stays a draft exactly as it did when a human published it.
  publish:
    name: Publish the release
    # `installer` is in here on purpose, and it is the one place Windows is
    # tier 1 rather than tier 2 (ADR-0044 consequence 3). Support is best-effort;
    # the *artifact* is not. A release that shipped without the `.exe` would
    # leave every Windows user on the previous one with nothing saying why, which
    # is the same silent failure v0.10.1's one-platform manifest was. Safe to
    # block on because this job builds on Linux and compiles nothing.
    needs: [create-release, build, installer]
    # `installer` is skipped for an alpha, and a skipped need skips this job
    # too unless it says otherwise — so it says exactly which results count.
    if: >-
      always() &&
      needs.create-release.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.installer.result == 'success' ||
        (inputs.channel == 'alpha' && needs.installer.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const { owner, repo } = context.repo;
            const alpha = process.env.CHANNEL === 'alpha';

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            const names = assets.map((a) => a.name);
            core.info(`assets: ${names.join(', ') || '(none)'}`);

            // The second half of the gate, and the half that catches what green
            // matrix jobs do not say. Each platform's installer plus the manifest
            // the app polls — checked by suffix rather than exact name, because
            // the version is in most of them and the version is not this job's
            // business.
            const required = [
              ['a macOS installer', (n) => n.endsWith('.dmg')],
              ['a macOS updater bundle', (n) => n.endsWith('.app.tar.gz')],
              ['a Linux installer', (n) => n.endsWith('.AppImage')],
              // The Windows bootstrapper (ADR-0044), stable only (ADR-0064).
              // Note there is deliberately no matching `latest.json` platform
              // check below: the installed app on Windows *is* the Linux
              // AppImage, and `tauri-plugin-updater` resolves its key from the
              // compile-time target triple, so it looks up `linux-x86_64` and
              // could never read a windows entry.
              ...(alpha ? [] : [['the Windows installer', (n) => n.endsWith('.exe')]]),
              ['the updater manifest', (n) => n === 'latest.json'],
            ];
            const missing = required.filter(([, match]) => !names.some(match)).map(([what]) => what);
            if (missing.length) {
              core.setFailed(
                `Refusing to publish ${release_id}: missing ${missing.join(', ')}. ` +
                  `The release stays a draft — re-run the failed matrix job, then re-run this one.`,
              );
              return;
            }

            // And the manifest's own contents, which is where v0.10.1 actually
            // went wrong: both platforms' jobs succeeded, and the file still
            // named one of them. `latest.json` is fetched through the API rather
            // than its browser URL because a draft's assets are not public yet.
            const manifest = assets.find((a) => a.name === 'latest.json');
            const res = await github.request({
              method: 'GET',
              url: manifest.url,
              headers: { accept: 'application/octet-stream' },
            });
            let platforms;
            try {
              platforms = Object.keys(JSON.parse(Buffer.from(res.data).toString('utf8')).platforms);
            } catch (e) {
              core.setFailed(`Refusing to publish ${release_id}: latest.json is unreadable (${e}).`);
              return;
            }
            core.info(`latest.json platforms: ${platforms.join(', ') || '(none)'}`);

            const unlisted = ['darwin', 'linux'].filter(
              (os) => !platforms.some((key) => key.startsWith(os)),
            );
            if (unlisted.length) {
              core.setFailed(
                `Refusing to publish ${release_id}: latest.json lists no ${unlisted.join(' or ')} ` +
                  `platform, so those installs would see no update. The release stays a draft.`,
              );
              return;
            }

            // A stable is made Latest explicitly rather than by GitHub's date
            // heuristic, because /releases/latest is what every stable install
            // polls (ADR-0010). An alpha is a prerelease and can never be it.
            await github.rest.repos.updateRelease({
              owner, repo, release_id,
              draft: false,
              make_latest: alpha ? 'false' : 'true',
            });
            core.info(`published release ${release_id}`);

  # Point the alpha channel at the release just published (ADR-0064). A fixed
  # release, tagged `alpha-channel`, whose one asset is a copy of the newest
  # alpha's `latest.json` — the manifest's URLs still point into that alpha's
  # own release, so nothing else is copied. After `publish` on purpose: an
  # alpha that failed its check must never become what alpha installs see.
  #
  # The pointer is itself a prerelease so it can never become Latest. Between
  # the delete and the upload the file is briefly absent; an install polling in
  # that second gets an error the updater logs and retries six hours later.
  point-alpha:
    name: Point the alpha channel at it
    needs: [publish]
    if: inputs.channel == 'alpha'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      POINTER: alpha-channel
    steps:
      - name: Replace the pointer's latest.json
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          # The pointer release and its tag are created once, on the first
          # alpha. The tag never moves; only the asset does.
          if ! gh release view "$POINTER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$POINTER" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --prerelease --latest=false \
              --title "Alpha channel" \
              --notes "The update manifest alpha installs poll (ADR-0064). Not a release: its only asset points at the newest alpha."
          fi
          gh release upload "$POINTER" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "alpha-channel now serves $TAG" >> "$GITHUB_STEP_SUMMARY"
